<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gran Polla Mundial 2026 · Amigos de Chicauma</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--verde:#1a5c38;--verde-neon:#00e676;--amarillo:#f5c518;--bg:#0d0d1a;--bg2:#12122a;--bg3:#1a1a35;--card:#1e1e3a;--border:#2a2a4a;--text:#e8e8f0;--text2:#8888aa;--rojo:#ff4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:linear-gradient(135deg,var(--bg2) 0%,var(--verde) 100%);border-bottom:2px solid var(--verde-neon);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(0,230,118,.15);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;color:var(--amarillo);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.logo .g{color:var(--verde-neon);}
.logo .sub{color:var(--text2);font-size:.7rem;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:1px;}
.user-info{display:flex;align-items:center;gap:10px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bg);font-size:.85rem;flex-shrink:0;}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.78rem;transition:all .2s;}
.btn-logout:hover{border-color:var(--rojo);color:var(--rojo);}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 20px;overflow-x:auto;}
.nav-tab{padding:13px 18px;cursor:pointer;font-size:.83rem;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.nav-tab.active{color:var(--verde-neon);border-bottom-color:var(--verde-neon);}
.nav-tab:hover:not(.active){color:var(--text);}
.main{max-width:1100px;margin:0 auto;padding:26px 18px;}
.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-size:.78rem;margin-bottom:18px;}
.sync-bar.ok{background:rgba(0,230,118,.07);color:var(--verde-neon);border:1px solid rgba(0,230,118,.2);}
.sync-bar.loading{background:rgba(245,197,24,.07);color:var(--amarillo);border:1px solid rgba(245,197,24,.2);}
.sync-bar.error{background:rgba(255,68,68,.07);color:var(--rojo);border:1px solid rgba(255,68,68,.2);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.sync-dot.pulse{animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.auth-wrap{max-width:420px;margin:70px auto;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:3px;color:var(--amarillo);margin-bottom:6px;}
.auth-sub{color:var(--text2);font-size:.88rem;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.77rem;font-weight:600;color:var(--text2);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:.93rem;outline:none;transition:border .2s;}
.field input:focus{border-color:var(--verde-neon);}
.btn-primary{width:100%;background:var(--verde-neon);color:var(--bg);border:none;border-radius:8px;padding:12px;font-weight:700;font-size:.97rem;cursor:pointer;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.auth-switch{text-align:center;margin-top:18px;font-size:.83rem;color:var(--text2);}
.auth-switch a{color:var(--verde-neon);cursor:pointer;}
.error-msg{background:rgba(255,68,68,.1);border:1px solid var(--rojo);color:var(--rojo);border-radius:8px;padding:9px 13px;font-size:.83rem;margin-bottom:14px;}
.scoreboard{background:linear-gradient(135deg,#0a1628,#112240);border:1px solid #1e3a5f;border-radius:16px;padding:22px 26px;margin-bottom:26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;}
.scoreboard-item{text-align:center;}
.scoreboard-label{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:3px;color:var(--text2);}
.scoreboard-value{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;color:var(--amarillo);line-height:1;text-shadow:0 0 20px rgba(245,197,24,.35);}
.scoreboard-divider{width:1px;height:56px;background:var(--border);}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(--text);margin-bottom:5px;}
.section-sub{color:var(--text2);font-size:.82rem;margin-bottom:18px;}
.grupo-header{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
.grupo-badge{background:var(--verde);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;padding:3px 13px;border-radius:6px;}
.grupo-line{flex:1;height:1px;background:var(--border);}
.partido-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:9px;display:flex;align-items:center;gap:14px;transition:border-color .2s;flex-wrap:wrap;}
.partido-card:hover{border-color:#3a3a5a;}
.partido-card.apostado{border-left:3px solid var(--verde-neon);}
.partido-fecha{font-size:.73rem;color:var(--text2);min-width:76px;}
.partido-equipos{flex:1;display:flex;align-items:center;gap:8px;min-width:220px;}
.equipo-nombre{font-weight:600;font-size:.88rem;min-width:80px;}
.equipo-nombre.home{text-align:right;}
.equipo-nombre.away{text-align:left;}
.vs-badge{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:.73rem;color:var(--text2);font-weight:600;flex-shrink:0;}
.apuesta-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 13px;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s;}
.apuesta-btn:hover{border-color:var(--amarillo);color:var(--amarillo);}
.apuesta-btn.selected{background:var(--verde-neon);color:var(--bg);border-color:var(--verde-neon);}
.score-input{width:42px;background:var(--bg3);border:1px solid var(--border);color:var(--text);text-align:center;border-radius:6px;padding:5px 3px;font-size:.97rem;font-weight:700;outline:none;transition:border .2s;}
.score-input:focus{border-color:var(--verde-neon);}
.btn-save{background:transparent;border:1px solid var(--verde-neon);color:var(--verde-neon);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s;white-space:nowrap;}
.btn-save:hover{background:var(--verde-neon);color:var(--bg);}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.ap-ok{font-size:.78rem;color:var(--verde-neon);display:flex;align-items:center;gap:4px;}
.tabla-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.tabla-header{display:grid;grid-template-columns:38px 1fr repeat(4,58px);padding:13px 18px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:.73rem;color:var(--text2);font-weight:600;letter-spacing:.5px;text-transform:uppercase;gap:8px;}
.tabla-row{display:grid;grid-template-columns:38px 1fr repeat(4,58px);padding:14px 18px;border-bottom:1px solid var(--border);align-items:center;gap:8px;transition:background .15s;}
.tabla-row:last-child{border-bottom:none;}
.tabla-row:hover{background:rgba(255,255,255,.02);}
.tabla-row.me{background:rgba(0,230,118,.05);border-left:3px solid var(--verde-neon);}
.rank{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:var(--text2);text-align:center;}
.rank.gold{color:#ffd700;}.rank.silver{color:#c0c0c0;}.rank.bronze{color:#cd7f32;}
.user-cell{display:flex;align-items:center;gap:9px;}
.mini-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;color:var(--bg);flex-shrink:0;}
.pts-cell{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;color:var(--amarillo);text-align:center;}
.num-cell{text-align:center;color:var(--text2);font-size:.87rem;}
.pill-v{background:rgba(0,230,118,.1);color:var(--verde-neon);border-radius:5px;padding:1px 6px;font-size:.7rem;font-weight:700;}
.grid-ap{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
.ap-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 17px;}
.ap-card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.ap-match{font-weight:600;font-size:.87rem;}
.ap-res{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;color:var(--amarillo);}
.ap-meta{font-size:.73rem;color:var(--text2);}
.pts-ex{color:var(--verde-neon);font-weight:700;font-size:.78rem;}
.pts-gn{color:var(--amarillo);font-weight:700;font-size:.78rem;}
.pts-0{color:var(--text2);font-size:.78rem;}
.badge-ex{background:rgba(0,230,118,.15);color:var(--verde-neon);border-radius:4px;padding:2px 5px;font-size:.7rem;font-weight:700;}
.empty{text-align:center;padding:56px 20px;color:var(--text2);}
.empty .ico{font-size:2.8rem;margin-bottom:10px;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px);}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:460px;width:100%;}
.modal-t{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:2px;margin-bottom:5px;}
.modal-act{display:flex;gap:9px;margin-top:22px;}
.btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--text2);padding:10px;border-radius:8px;cursor:pointer;font-size:.88rem;transition:all .2s;}
.btn-cancel:hover{border-color:var(--rojo);color:var(--rojo);}
.btn-ok{flex:2;background:var(--verde-neon);border:none;color:var(--bg);padding:10px;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:700;transition:opacity .2s;}
.btn-ok:hover{opacity:.85;}
.btn-ok:disabled{opacity:.5;cursor:not-allowed;}
.score-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0;}
.score-b{display:flex;flex-direction:column;align-items:center;gap:5px;}
.score-b label{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.score-b input{width:68px;text-align:center;background:var(--bg3);border:2px solid var(--border);color:var(--text);font-size:1.9rem;font-family:'Bebas Neue',sans-serif;border-radius:10px;padding:7px 3px;outline:none;transition:border .2s;}
.score-b input:focus{border-color:var(--verde-neon);}
.score-sep{font-family:'Bebas Neue',sans-serif;font-size:2.3rem;color:var(--text2);}
.pts-info{background:var(--bg3);border-radius:9px;padding:13px;margin-top:14px;}
.pts-info h4{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
.pi-row{display:flex;justify-content:space-between;font-size:.8rem;padding:3px 0;}
.pi-pts{color:var(--amarillo);font-weight:700;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--verde-neon);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:700;font-size:.87rem;z-index:999;transform:translateY(80px);opacity:0;transition:all .33s;max-width:280px;}
.toast.show{transform:translateY(0);opacity:1;}
.stats-strip{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.stat-p{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 18px;flex:1;min-width:100px;}
.stat-p .lbl{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.stat-p .val{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--amarillo);line-height:1;}
.stat-p .sub{font-size:.72rem;color:var(--text2);}
.flex-g{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--verde-neon);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:580px){.tabla-header,.tabla-row{grid-template-columns:34px 1fr repeat(3,46px);}.scoreboard-divider{display:none;}}
</style>

const CLR=['#00e676','#f5c518','#ff4081','#4488ff','#ff9800','#e91e63','#00bcd4','#8bc34a','#9c27b0','#ff5722'];
function uclr(n){let h=0;for(let c of n)h=(h+c.charCodeAt(0))%CLR.length;return CLR[h];}

// API
async function apiGet(){const r=await fetch(`${SCRIPT_URL}?action=getAll`);return r.json();}
async function apiPost(action,data){await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,data})});}

// CACHE
let C={users:[],apuestas:[],resultados:[],lastSync:null};
function apMap(){
  const m={};
  for(const a of C.apuestas){if(!m[a.username])m[a.username]={};m[a.username][a.pid]={l:a.local,v:a.visita};}
  return m;
}
function resMap(){const m={};for(const r of C.resultados)m[r.pid]={l:r.local,v:r.visita};return m;}
function calcPts(u){
  const am=apMap()[u]||{},rm=resMap();let t=0,ex=0,gn=0;
  for(const pid in am){const a=am[pid],r=rm[pid];if(!r)continue;
    const aL=+a.l,aV=+a.v,rL=+r.l,rV=+r.v;
    if(aL===rL&&aV===rV){t+=PTS_E;ex++;}
    else{const ag=aL>aV?'L':aL<aV?'V':'E',rg=rL>rV?'L':rL<rV?'V':'E';if(ag===rg){t+=PTS_G;gn++;}}
  }
  return{t,ex,gn,n:Object.keys(am).length};
}

function ss(p){Object.assign(S,p);render();}

function toast(msg,c){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=c||'var(--verde-neon)';t.style.color=c?'#fff':'var(--bg)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);
}

// SYNC
async function sync(silent=false){
  if(!silent)ss({ss:'loading'});
  try{
    const d=await apiGet();
    C.users=d.users||[];C.apuestas=d.apuestas||[];C.resultados=d.resultados||[];
    C.lastSync=new Date();
    S.ss='ok';if(!silent)render();
  }catch(e){S.ss='error';if(!silent)render();}
}
function startSync(){stopSync();tmr=setInterval(async()=>{if(S.user){await sync(true);render();}},SYNC_MS);}
function stopSync(){if(tmr){clearInterval(tmr);tmr=null;}}

// RENDER
function render(){
  const root=document.getElementById('root');
  if(!S.user){root.innerHTML=renderAuth();bindAuth();return;}
  root.innerHTML=renderShell();bindApp();
}

function syncBar(){
  const hr=C.lastSync?C.lastSync.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';
  if(S.ss==='ok')return`<div class="sync-bar ok"><div class="sync-dot"></div>Sincronizado · ${hr}&nbsp;<span style="cursor:pointer;text-decoration:underline;opacity:.7;margin-left:4px" id="b-ref">↻</span></div>`;
  if(S.ss==='loading')return`<div class="sync-bar loading"><div class="sync-dot pulse"></div>Sincronizando con Google Sheets...</div>`;
  return`<div class="sync-bar error"><div class="sync-dot"></div>Sin conexión &nbsp;<span style="cursor:pointer;text-decoration:underline" id="b-ret">Reintentar</span></div>`;
}

      <button class="btn-primary" id="b-auth">${isL?'Entrar':'Registrarme'}</button>
      <div class="auth-switch">${isL?`¿No tienes cuenta? <a id="sw-auth">Regístrate aquí</a>`:`¿Ya tienes cuenta? <a id="sw-auth">Inicia sesión</a>`}</div>
    </div>
  </div>`;
}
function bindAuth(){
  document.getElementById('sw-auth')?.addEventListener('click',()=>ss({auth:S.auth==='login'?'register':'login'}));
  document.getElementById('b-auth')?.addEventListener('click',async()=>{
    const usr=document.getElementById('f-usr')?.value.trim().toLowerCase();
    const pw=document.getElementById('f-pw')?.value;
    const me=document.getElementById('auth-msg'),btn=document.getElementById('b-auth');
    if(!usr||!pw){me.innerHTML='<div class="error-msg">Completa todos los campos</div>';return;}
    btn.disabled=true;btn.textContent='Conectando...';
    await sync(true);
    if(S.auth==='login'){
      const f=C.users.find(u=>u.user===usr&&u.pass===pw);
      if(!f){me.innerHTML='<div class="error-msg">Usuario o contraseña incorrectos</div>';btn.disabled=false;btn.textContent='Entrar';return;}
      localStorage.setItem('pm_s',usr);ss({user:f,page:'partidos',ss:'ok'});startSync();
    }else{
      const nom=document.getElementById('f-nom')?.value.trim()||usr;
      if(C.users.find(u=>u.user===usr)){me.innerHTML='<div class="error-msg">Ese usuario ya existe</div>';btn.disabled=false;btn.textContent='Registrarme';return;}
      const nw={user:usr,pass:pw,nombre:nom,color:uclr(nom),ts:Date.now()};
      C.users.push(nw);await apiPost('saveUser',nw);
      localStorage.setItem('pm_s',usr);ss({user:nw,page:'partidos',ss:'ok'});startSync();
      toast('¡Bienvenido/a '+nom+'! 🎉');
    }
  });
  document.getElementById('f-pw')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('b-auth').click();});
}

  <div class="tabla-wrap">
    <div class="tabla-header"><div>#</div><div>Participante</div><div>PTS</div><div>⭐</div><div>✅</div><div>📋</div></div>
    ${rows.map((u,i)=>`<div class="tabla-row ${u.user===me?'me':''}">
      <div class="rank ${rc(i)}">${re(i)||i+1}</div>
      <div class="user-cell">
        <div class="mini-av" style="background:${u.color||uclr(u.nombre)}">${(u.nombre||'?')[0].toUpperCase()}</div>
        <div><div style="font-weight:600;font-size:.87rem">${u.nombre} ${u.user===me?'<span class="pill-v">Tú</span>':''}</div>
        <div style="font-size:.7rem;color:var(--text2)">@${u.user}</div></div>
      </div>
      <div class="pts-cell">${u.t}</div>
      <div class="num-cell" style="color:var(--verde-neon);font-weight:700">${u.ex}</div>
      <div class="num-cell" style="color:var(--amarillo)">${u.gn}</div>
      <div class="num-cell">${u.n}</div>
    </div>`).join('')}
  </div>
  <div style="margin-top:12px;font-size:.72rem;color:var(--text2);display:flex;gap:16px;flex-wrap:wrap">
    <span>PTS=Puntos</span><span>⭐=Exactos(${PTS_E}pts)</span><span>✅=Ganadores(${PTS_G}pts)</span><span>📋=Nº apuestas</span>
  </div>`;
}

// RESULTADOS
function rResultados(){
  const rm=resMap(),fg=S.fg;
  const gs=['Todos',...GRUPOS.map(g=>`Grupo ${g.id}`)];
  return`
  <div class="section-title">CARGAR RESULTADOS</div>
  <div class="section-sub">Al guardar, los puntos de TODOS los participantes se actualizan automáticamente en tiempo real</div>
  <div class="flex-g" style="margin:14px 0 18px">
    ${gs.map(g=>`<button class="apuesta-btn ${fg===g?'selected':''}" data-fg="${g}">${g}</button>`).join('')}
  </div>
  ${GRUPOS.filter(g=>fg==='Todos'||fg===`Grupo ${g.id}`).map(g=>{
    const ps=TODOS.filter(p=>p.gid===g.id);
    return`<div class="grupo-header"><div class="grupo-badge">GRUPO ${g.id}</div><div class="grupo-line"></div></div>
    ${ps.map(p=>{const res=rm[p.id];return`
      <div class="partido-card ${res?'apostado':''}">
        <div class="partido-fecha">${p.fd}</div>
        <div class="partido-equipos">
          <div class="equipo-nombre home">${p.loc.f} ${p.loc.n}</div>
          <div style="display:flex;align-items:center;gap:7px">
            <input type="number" class="score-input ri" data-pid="${p.id}" data-s="l" min="0" max="20" value="${res?res.l:''}" placeholder="-"/>
            <span style="color:var(--text2);font-weight:700">-</span>
            <input type="number" class="score-input ri" data-pid="${p.id}" data-s="v" min="0" max="20" value="${res?res.v:''}" placeholder="-"/>
          </div>
          <div class="equipo-nombre away">${p.vis.n} ${p.vis.f}</div>
        </div>
        <button class="btn-save rs" data-pid="${p.id}">${res?'✅ Actualizar':'Guardar'}</button>
      </div>`;}).join('')}`;
  }).join('')}`;
}

// BIND
function bindApp(){
  document.getElementById('b-out')?.addEventListener('click',()=>{stopSync();localStorage.removeItem('pm_s');ss({user:null,page:'login',auth:'login'});});
  document.querySelectorAll('.nav-tab').forEach(el=>el.addEventListener('click',()=>ss({page:el.dataset.page})));
  document.querySelectorAll('[data-fg]').forEach(el=>el.addEventListener('click',()=>ss({fg:el.dataset.fg})));
  document.getElementById('b-ret')?.addEventListener('click',()=>sync().then(()=>render()));
  document.getElementById('b-ref')?.addEventListener('click',()=>sync().then(()=>render()));

  // abrir modal
  document.querySelectorAll('[data-pid].btn-save:not(.rs)').forEach(el=>{
    el.addEventListener('click',()=>{const p=TODOS.find(x=>x.id===el.dataset.pid);ss({modal:p,mL:'0',mV:'0'});});
  });
  document.getElementById('m-ov')?.addEventListener('click',()=>ss({modal:null}));
  document.getElementById('m-cancel')?.addEventListener('click',()=>ss({modal:null}));
  document.getElementById('sc-l')?.addEventListener('input',e=>{S.mL=e.target.value;});
  document.getElementById('sc-v')?.addEventListener('input',e=>{S.mV=e.target.value;});
  document.getElementById('m-ok')?.addEventListener('click',async()=>{
    const l=parseInt(document.getElementById('sc-l')?.value||0);
    const v=parseInt(document.getElementById('sc-v')?.value||0);
    if(isNaN(l)||isNaN(v)){toast('⚠️ Ingresa un resultado válido','var(--rojo)');return;}
    const btn=document.getElementById('m-ok');btn.disabled=true;btn.textContent='Guardando...';
    const pid=S.modal.id;
    const row={id:`${S.user.user}_${pid}`,username:S.user.user,pid,local:l,visita:v};
    const idx=C.apuestas.findIndex(a=>a.username===S.user.user&&a.pid===pid);
    if(idx>=0)C.apuestas[idx]=row;else C.apuestas.push(row);
    try{await apiPost('saveApuesta',row);toast('⚽ Apuesta guardada!');}
    catch(e){toast('⚠️ Error al guardar','var(--rojo)');}
    ss({modal:null});
  });

  // guardar resultados
  document.querySelectorAll('.rs').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const pid=btn.dataset.pid;
      const iL=document.querySelector(`.ri[data-pid="${pid}"][data-s="l"]`);
      const iV=document.querySelector(`.ri[data-pid="${pid}"][data-s="v"]`);
      if(!iL||!iV||iL.value===''||iV.value===''){toast('⚠️ Ingresa ambos marcadores','var(--rojo)');return;}
      btn.disabled=true;btn.textContent='Guardando...';
      const row={id:pid,pid,local:parseInt(iL.value),visita:parseInt(iV.value)};
      const idx=C.resultados.findIndex(r=>r.pid===pid);
      if(idx>=0)C.resultados[idx]=row;else C.resultados.push(row);
      try{await apiPost('saveResultado',row);toast('🎯 Resultado guardado · puntos actualizados para todos!');}
      catch(e){toast('⚠️ Error al guardar','var(--rojo)');}
      render();
    });
  });
}

// INIT
(async function(){
  document.getElementById('root').innerHTML=`<div class="ld">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:3px;color:var(--amarillo)">⚽ GRAN POLLA MUNDIAL</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:3px;color:var(--text2)">AMIGOS DE CHICAUMA</div>
    <div class="spinner"></div>
    <div style="color:var(--text2);font-size:.82rem">Conectando con Google Sheets...</div>
  </div>`;
  await sync(true);
  const ses=localStorage.getItem('pm_s');
  if(ses){const u=C.users.find(x=>x.user===ses);if(u){S.user=u;S.page='partidos';startSync();}}
  render();
})();
</script>
